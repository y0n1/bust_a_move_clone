name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Sets permissions for the GITHUB_TOKEN to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip in-progress runs on the same branch
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned, not floating on a channel. Bump deliberately:
      # see docs/ops/deployment.md § "Bumping the toolchain".
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /bust_a_move_clone/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy job only proves Pages accepted the artifact. This job proves
  # the site a visitor actually gets is the site we meant to ship: it loads the
  # live URL in a real browser and asserts HTTP 200, the released version, real
  # PNG icons and a reachable start screen with no blocking console errors.
  #
  # See OPS-4 (#82) and docs/ops/deployment.md.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    # Worst case is bounded: --wait 90 applies per network check (3 of them) plus
    # up to 90 s for Flutter to boot, so ~6 min of retrying. 15 min leaves room
    # for checkout, the Chrome launch and artifact upload on a slow runner.
    timeout-minutes: 15
    # Least privilege: this job only reads the repo and the public site.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify the deployed site
        run: |
          python3 test/quality/post_deploy_check.py \
            --url "$DEPLOY_URL" \
            --wait 90 \
            --artifacts-dir build/post-deploy-artifacts
        env:
          DEPLOY_URL: https://y0n1.github.io/bust_a_move_clone/

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-diagnostics
          path: build/post-deploy-artifacts
          if-no-files-found: ignore
          retention-days: 14
